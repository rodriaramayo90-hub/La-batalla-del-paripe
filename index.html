<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>La Batalla del Paripé</title><style>*{box-sizing:border-box}body{margin:0;background:#170a2c;color:white;font:16px system-ui;text-align:center}h1{color:#ffe84a;text-shadow:3px 3px #a20b99;font-size:clamp(25px,6vw,48px)}button{border:2px solid #ffdf45;background:#6422a4;color:white;border-radius:12px;padding:12px;font-weight:900;touch-action:none}#roster{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:720px;margin:auto;padding:7px}.fighter{border:2px solid #a650d7;border-radius:12px;padding:8px 2px;background:#2c1549;font-size:12px;min-height:95px}.fighter.sel{border-color:#ffe347;background:#653100}.face{font-size:32px}.fighter b{display:block}#detail{padding:12px}#start{background:#f4cc20;color:#24122c;font-size:18px;margin:14px}#arena{position:relative;width:min(100vw,960px);aspect-ratio:16/9;margin:auto;overflow:hidden;background:linear-gradient(#7bc5f6,#f8d9a0 62%,#536f5b 63%,#4b3d4c)}#scene{position:absolute;top:8%;width:100%;font-size:clamp(22px,4vw,52px);opacity:.8}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{display:flex;justify-content:space-around;gap:5px;padding:8px;font-size:12px}progress{width:27vw;max-width:260px;accent-color:#27e89a}#controls{display:flex;justify-content:space-between;max-width:960px;margin:8px auto;gap:8px;padding:5px}#controls button{min-width:45px;font-size:21px;padding:12px 7px}#msg{font-size:19px;font-weight:900;color:#ffe347;min-height:45px}#game,#finish{display:none}small{opacity:.8}#footer{padding:12px;font-size:12px;opacity:.7}</style><h1>⚡ LA BATALLA DEL PARIPÉ ⚡</h1><section id="menu"><h2>ELEGÍ TU LUCHADOR</h2><div id="roster"></div><div id="detail"></div><button id="start">⚡ COMENZAR CAMPEONATO</button></section><section id="game"><div id="hud"><span id="pn"></span><progress id="hp" max="100" value="100"></progress><b id="round"></b><progress id="he" max="100" value="100"></progress><span id="en"></span></div><div id="arena"><div id="scene"></div><canvas id="cv" width="960" height="540"></canvas></div><div id="msg"></div><div id="controls"><div><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">⬆</button></div><div><button data-k="punch">👊</button><button data-k="kick">🦶</button><button data-k="special">✨</button></div></div><small>Movete, saltá y atacá. Especial recarga cada 5 segundos.</small></section><section id="finish"><h2 id="endtitle"></h2><p id="endmsg"></p><button onclick="location.reload()">VOLVER AL SELECTOR</button><button id="retry">CONTINUAR</button></section><div id="footer">Versión inicial jugable · Móvil y ordenador · 1 jugador</div><script>
const F=[["Alcahueta","Ciruja callejera","Ataque de cirujeo",7,8,8,8,"👩🏻‍🦰"],["T-Rex","Dinosaurio desarticulado","Pierna voladora",9,5,8,6,"🦖"],["Coqui","Gimnasta acrobática","Flic Flac",7,8,5,9,"🤸‍♀️"],["Lucas","Experto en sobras","Flan de orujo",8,7,7,8,"🍮"],["Dr. Tostador","Médico experimental","Golden Shower",8,7,7,8,"👨‍⚕️"],["Dra. En Berga","Especialista en bolos fecales","Picada con sobreprecio",7,8,7,8,"👩‍⚕️"],["La Drapie","Limpieza profunda","Limpieza extrema",8,7,7,8,"🧹"],["Flor Rubia","Padelera implacable","Golpe de pádel",7,8,7,8,"🏓"],["Bites","Científico implacable","MIR",8,7,7,8,"📚"],["Malefica","Artista golpista","Ataque artístico",6,9,8,9,"🎨"],["Lu","Gritos aturdidores","Grito supersónico",6,9,8,9,"📣"],["Daf","Logística sanitaria","Respirador Air Liquide",7,8,7,8,"🫁"]];
let sel=1,queue=[],round=0,p,e,keys={},running=false,raf=0;const $=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d");function roster(){$("roster").innerHTML=F.map((f,i)=>'<div class="fighter '+(sel===i?'sel':'')+'" data-i="'+i+'"><div class="face">'+f[7]+'</div><b>'+f[0]+'</b><small>'+f[1]+'</small></div>').join("");let f=F[sel];$("detail").innerHTML='<b>'+f[0]+'</b> · '+f[1]+'<br>💪 '+f[3]+'/10 · ⚡ '+f[4]+'/10 · 🎯 '+f[5]+'/10 · ✨ '+f[6]+'/10<br><b>Especial: </b>'+f[2];document.querySelectorAll(".fighter").forEach(x=>x.onclick=()=>{sel=+x.dataset.i;roster()})}roster();
function unit(id,x){return{id,x,y:410,vy:0,hp:100,last:0,special:-5000,stun:0,flash:0}}function battle(){cancelAnimationFrame(raf);p=unit(sel,210);e=unit(queue[round],750);running=true;$("menu").style.display="none";$("finish").style.display="none";$("game").style.display="block";$("scene").textContent=["🌊 🗼 TORRE DE HÉRCULES 🌊","🏛️ PLAZA DE MARÍA PITA 🏛️","🌴 PLAYA DEL ORZÁN 🌊"][round%3];$("pn").textContent=F[sel][0];$("en").textContent=F[e.id][0];$("round").textContent=(round+1)+"/11";$("msg").textContent="¡A PELEAR!";raf=requestAnimationFrame(loop)}$("start").onclick=()=>{queue=F.map((_,i)=>i).filter(i=>i!==sel).sort(()=>Math.random()-.5);round=0;battle()};
function hit(a,b,type){let t=performance.now();if(t-a.last<(type==="special"?500:330)||a.stun>0)return;if(type==="special"&&t-a.special<5000)return;a.last=t;if(type==="special")a.special=t;let range=type==="special"?270:type==="kick"?115:85;if(Math.abs(a.x-b.x)<range&&Math.abs(a.y-b.y)<90){let dmg=type==="special"?12+F[a.id][6]*2:type==="kick"?8+F[a.id][3]:5+F[a.id][3];b.hp=Math.max(0,b.hp-dmg);b.stun=12;b.flash=12;b.x+=a.x<b.x?23:-23}if(a===p&&type==="special")$("msg").textContent=F[a.id][2]+"!"+(a.id===0?" ¡Alcahuetovich!":a.id===2?" ¡Burzaco papá!":a.id===3?" ¡Flan de orujo!":a.id===5?" ¡Son 50 euros!":a.id===7?" ¡Para vos Vero!":"")}
function draw(u){ctx.save();ctx.translate(u.x,u.y);ctx.fillStyle=u.flash>0?"#fff":u===p?"#ffd33d":"#ec54a9";ctx.strokeStyle="#1c1338";ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,-105,34,0,7);ctx.fill();ctx.stroke();ctx.fillRect(-27,-68,54,90);ctx.fillStyle="#19102c";ctx.font="55px system-ui";ctx.textAlign="center";ctx.fillText(F[u.id][7],0,-88);ctx.strokeStyle=u===p?"#ffdb4c":"#f56ca9";ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-15,20);ctx.lineTo(-25,82);ctx.moveTo(15,20);ctx.lineTo(25,82);ctx.moveTo(-25,-48);ctx.lineTo(-52,-5);ctx.moveTo(25,-48);ctx.lineTo(52,-5);ctx.stroke();ctx.fillStyle="white";ctx.font="bold 19px system-ui";ctx.fillText(F[u.id][0],0,-160);ctx.restore()}
function loop(){if(!running)return;ctx.clearRect(0,0,960,540);ctx.fillStyle="#6e594f";ctx.fillRect(0,495,960,45);let sp=F[sel][4]*.65+1.7;if(keys.left)p.x-=sp;if(keys.right)p.x+=sp;if(keys.jump&&p.y>=410)p.vy=-14;for(let u of [p,e]){u.x=Math.max(55,Math.min(905,u.x));u.y+=u.vy;u.vy+=.75;if(u.y>410){u.y=410;u.vy=0}u.stun=Math.max(0,u.stun-1);u.flash=Math.max(0,u.flash-1)}if(keys.punch)hit(p,e,"punch");if(keys.kick)hit(p,e,"kick");if(keys.special)hit(p,e,"special");if(Math.random()<.045&&e.stun===0){if(Math.abs(e.x-p.x)>90)e.x+=(p.x>e.x?1:-1)*(F[e.id][4]*.6+1);else hit(e,p,Math.random()<.12?"special":"punch")}draw(p);draw(e);$("hp").value=p.hp;$("he").value=e.hp;if(p.hp<=0||e.hp<=0){running=false;setTimeout(()=>end(e.hp<=0),650);return}raf=requestAnimationFrame(loop)}
function end(won){$("game").style.display="none";$("finish").style.display="block";if(won){round++;if(round===11){$("endtitle").textContent="🏆 ¡CAMPEÓN DEL PARIPÉ!";$("endmsg").textContent="¡Derrotaste a los 11 rivales!";$("retry").style.display="none"}else{$("endtitle").textContent="🏆 ¡VICTORIA!";$("endmsg").textContent=sel===1?"📱 ¡Riiing! T-Rex atiende: «¿Calle Derrota? Ni idea, maestro»":"Derrotaste a "+F[e.id][0]+". ¡Siguiente combate!";$("retry").style.display="inline-block";$("retry").textContent="SIGUIENTE COMBATE";if(sel===1&&"speechSynthesis"in window){let v=new SpeechSynthesisUtterance("¿Calle Derrota? Ni idea, maestro");v.lang="es-AR";speechSynthesis.speak(v)}}}else{$("endtitle").textContent="💥 DERROTA";$("endmsg").textContent="¡Probá otra vez contra "+F[e.id][0]+"!";$("retry").style.display="inline-block";$("retry").textContent="REINTENTAR"}}$("retry").onclick=battle;
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.addEventListener("pointerdown",ev=>{ev.preventDefault();keys[k]=true;b.setPointerCapture(ev.pointerId)});for(let event of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(event,()=>keys[k]=false)});const km={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"jump",a:"punch",s:"kick",d:"special"};window.addEventListener("keydown",ev=>{if(km[ev.key]){keys[km[ev.key]]=true;ev.preventDefault()}});window.addEventListener("keyup",ev=>{if(km[ev.key])keys[km[ev.key]]=false});
</script></html>
