<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#19082c"><title>La Batalla del Paripé</title><style>
*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:radial-gradient(circle at top,#6221a1,#10051c 75%);font-family:system-ui,Arial;color:white;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}h1{font-size:clamp(23px,5vw,46px);line-height:1.05;margin:8px;text-transform:uppercase;font-style:italic;text-shadow:4px 4px #6c008d;color:#ffeb2b;text-align:center}h2{text-align:center;margin:8px;font-size:20px}.screen{width:min(100%,900px);max-height:100%;overflow:auto;text-align:center}.hidden{display:none!important}.btn{border:2px solid #fff;border-radius:13px;background:#7423c3;color:white;padding:12px 17px;font-weight:900;font-size:16px;margin:6px;cursor:pointer;box-shadow:0 4px #320654}.btn.primary{background:#ffe333;color:#211036;box-shadow:0 4px #b87b00}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:860px;margin:10px auto}.fighter{background:linear-gradient(140deg,#642b91,#1c1035);border:2px solid #b664f6;border-radius:12px;padding:5px;cursor:pointer;min-width:0}.fighter.selected{border:3px solid #ffe638;background:#623400}.fighter img{height:clamp(100px,19vh,185px);width:100%;object-fit:cover;object-position:top;border-radius:8px}.fighter b{font-size:clamp(10px,2vw,15px);display:block}.fighter small{font-size:10px;color:#e6d2ff}.stats{font-size:13px;margin:8px auto;max-width:690px;background:#211136;padding:9px;border-radius:12px}.game{width:min(100%,1000px);display:flex;flex-direction:column;gap:5px}.hud{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:bold}.hud .side{flex:1;min-width:0}.hud .side:last-child{text-align:right}.bar{height:15px;border:2px solid white;background:#321325;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#29db60,#d6f844);transition:width .12s}.arena{position:relative;width:100%;aspect-ratio:16/9;max-height:60dvh;overflow:hidden;border:3px solid #a34dff;border-radius:12px;background:#122}.arena img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.arena canvas{position:absolute;inset:0;width:100%;height:100%}.controls{display:flex;justify-content:space-between;gap:8px;align-items:center;user-select:none}.control-group{display:flex;gap:7px}.ctl{border:2px solid #ddd;border-radius:50%;width:clamp(49px,12vw,76px);height:clamp(49px,12vw,76px);font-weight:900;color:white;background:#6325a3;font-size:19px;touch-action:none}.ctl.attack{background:#d52d4d}.ctl.special{background:#ad35dc}.ctl:active{transform:scale(.94);background:#ffbd27}.note{font-size:12px;color:#ddc9f3}.overlay{position:absolute;inset:0;background:#120723d9;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:3;padding:15px;text-align:center}.overlay h2{font-size:clamp(22px,5vw,42px);color:#ffdf30}.overlay p{font-size:clamp(14px,3vw,20px)}.phone{font-size:55px;animation:ring .35s infinite alternate}@keyframes ring{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}@media (max-height:640px){.arena{max-height:53dvh}.hud{font-size:10px}.ctl{width:48px;height:48px}}@media (orientation:landscape) and (max-height:500px){#app{padding:2px}.arena{max-height:62dvh}.ctl{height:40px;width:50px}.note{display:none}}
</style></head><body><div id="app">
<section id="menu" class="screen"><h1>LA BATALLA DEL<br>PARIPÉ</h1><p>🥊 12 luchadores ilustrados · 11 rivales · 3 escenarios de A Coruña</p><button class="btn primary" onclick="showSelect()">▶ JUGAR</button><p>Derrotá a todos los rivales y convertite en campeón.</p><p class="note">Móvil: botones táctiles · Ordenador: ← →, ↑, J, K, L</p></section>
<section id="select" class="screen hidden"><h1>ELIGE TU LUCHADOR</h1><div id="roster" class="grid"></div><div id="detail" class="stats"></div><button class="btn primary" onclick="startCampaign()">⚡ COMENZAR CAMPEONATO</button><button class="btn" onclick="goMenu()">Volver</button></section>
<section id="game" class="game hidden"><div class="hud"><div class="side"><span id="pn"></span><div class="bar"><div id="ph" class="fill"></div></div></div><strong id="round">1 / 11</strong><div class="side"><span id="en"></span><div class="bar"><div id="eh" class="fill"></div></div></div></div><div class="arena" id="arena"><img id="bg" src="assets/bg0.jpg"><canvas id="canvas" width="960" height="540"></canvas><div class="overlay hidden" id="overlay"><div id="overlayContent"></div><div id="overlayButtons"></div></div></div><div class="controls"><div class="control-group"><button class="ctl" data-key="left">◀</button><button class="ctl" data-key="right">▶</button><button class="ctl" data-key="jump">⬆</button></div><div class="control-group"><button class="ctl attack" data-key="punch">👊</button><button class="ctl attack" data-key="kick">🦶</button><button class="ctl special" data-key="special">✦</button></div></div><div class="note">👊 Golpe · 🦶 Patada · ✦ Especial (recarga automática) · <span id="cool">Especial listo</span></div></section>
</div><script>
const fighters=[
['Alcahueta','Ciruja callejera','Ataque de Cirujeo',7,8,8,8,'#df395c','¡Alcahuetovich!'],
['T-Rex','Dinosaurio desarticulado','Pierna voladora',9,5,8,6,'#3e9b76','RAAAAAWR'],
['Coqui','Gimnasta acrobática','Flic Flac',7,8,5,9,'#e2a936','¡Burzaco papá!'],
['Lucas','Experto en sobras','Flan de Orujo',8,7,7,8,'#5d9fea','¡Flan de orujo!'],
['Dr. Tostador','Médico experimental','Golden Shower',8,7,7,8,'#ae70e0','¡Golden Shower!'],
['Dra. En Berga','Especialista en bolos fecales','Picada con Sobreprecio',7,8,7,8,'#ef6d89','¡Son 50 euros!'],
['La Drapie','Limpieza profunda','Limpieza Extrema',8,7,7,8,'#4fb7c7','¡Limpieza extrema!'],
['Flor Rubia','Padelera implacable','Paletazo',7,8,7,8,'#f7a84d','¡Para vos, Vero!'],
['Bites','Científico implacable','MIR',8,7,7,8,'#91b3ff','¡MIR!'],
['Malefica','Artista golpista','Ataque Artístico',6,9,8,9,'#a850e9','¡Ataque artístico!'],
['Lu','Gritos aturdidores','Grito Supersónico',6,9,8,9,'#df3e9d','¡Grito supersónico!'],
['Daf','Logística sanitaria','Respirador de Air Liquide',7,8,7,8,'#56b4b1','¡Respirador!']
];
const portraits=Array.from({length:12},(_,i)=>{let im=new Image();im.src='assets/face'+i+'.jpg';return im});let selected=0,queue=[],battle=0,player,enemy,projectiles=[],effects=[],mode='menu',last=0,keys={},aiClock=0,frame=0,announcement='',announceTime=0,animationId=0;
const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function show(id){['menu','select','game'].forEach(s=>$(s).classList.toggle('hidden',s!==id));mode=id}
function goMenu(){cancelAnimationFrame(animationId);show('menu')}
function showSelect(){show('select');renderRoster()}
function renderRoster(){ $('roster').innerHTML=fighters.map((f,i)=>`<div class="fighter ${i===selected?'selected':''}" onclick="choose(${i})"><img src="assets/face${i}.jpg" alt="${f[0]}"><b>${f[0]}</b><small>${f[1]}</small></div>`).join('');let f=fighters[selected];$('detail').innerHTML=`<b>${f[0]}</b> · ${f[1]}<br>💪 ${f[3]}/10 · ⚡ ${f[4]}/10 · 🎯 ${f[5]}/10 · ✨ ${f[6]}/10<br><b>Especial:</b> ${f[2]}`}
function choose(i){selected=i;renderRoster()}
function startCampaign(){queue=fighters.map((_,i)=>i).filter(i=>i!==selected);for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}battle=0;show('game');newBattle()}
function entity(id,x,dir){return{id,x,y:0,vy:0,dir,hp:100,cool:0,attack:0,attackType:'',hit:false,stun:0,invuln:0,walk:0}}
function newBattle(){ending=false;keys={};player=entity(selected,240,1);enemy=entity(queue[battle],720,-1);projectiles=[];effects=[];announcement='¡A PELEAR!';announceTime=90;$('overlay').classList.add('hidden');$('bg').src='assets/bg'+(battle%3)+'.jpg';$('pn').textContent=fighters[selected][0];$('en').textContent=fighters[enemy.id][0];$('round').textContent=`BATALLA ${battle+1} / 11`;last=0;cancelAnimationFrame(animationId);animationId=requestAnimationFrame(loop)}
function hit(target,damage,push){if(target.invuln>0)return;target.hp=clamp(target.hp-damage,0,100);target.stun=16;target.invuln=22;target.x=clamp(target.x+push,65,895);effects.push({x:target.x,y:345,t:23,text:'-'+Math.round(damage)});if(target.hp<=0){setTimeout(()=>finish(target===enemy),380)}}
function strike(a,b,type){if(a.attack>0||a.stun>0)return;let f=fighters[a.id];if(type==='special'){if(a.cool>0)return;a.cool=360;a.attack=36;a.attackType='special';announcement=f[8];announceTime=75;projectiles.push({x:a.x+a.dir*55,y:310,dir:a.dir,owner:a,life:80,speed:11+f[5],damage:12+f[6]*1.7,color:f[7]});}else{a.attack=type==='kick'?25:17;a.attackType=type;let reach=type==='kick'?100:72;if(Math.abs(a.x-b.x)<reach+f[5]*5&&Math.abs(a.y-b.y)<65){hit(b,(type==='kick'?7:5)+f[3]*.65,a.dir*30)}}}
function update(dt){frame++;for(let a of [player,enemy]){a.cool=Math.max(0,a.cool-dt);a.attack=Math.max(0,a.attack-dt);a.stun=Math.max(0,a.stun-dt);a.invuln=Math.max(0,a.invuln-dt);a.vy-=.85*dt;a.y+=a.vy*dt;if(a.y<0){a.y=0;a.vy=0}a.x=clamp(a.x,55,905);a.dir=a===player?(enemy.x>player.x?1:-1):(player.x>enemy.x?1:-1)}if(player.stun<=0){let speed=2.3+fighters[player.id][4]*.35;if(keys.left)player.x-=speed*dt;if(keys.right)player.x+=speed*dt;if(keys.jump&&player.y===0)player.vy=15;if(keys.punch){strike(player,enemy,'punch');keys.punch=false}if(keys.kick){strike(player,enemy,'kick');keys.kick=false}if(keys.special){strike(player,enemy,'special');keys.special=false}}
aiClock-=dt;if(aiClock<=0&&enemy.stun<=0){let dist=Math.abs(enemy.x-player.x);if(dist>115)enemy.x+=enemy.dir*(2+fighters[enemy.id][4]*.3)*dt;else if(Math.random()<.72)strike(enemy,player,Math.random()<.65?'punch':'kick');if(enemy.cool<=0&&Math.random()<.18)strike(enemy,player,'special');if(Math.random()<.07&&enemy.y===0)enemy.vy=13;aiClock=16+Math.random()*25}for(let p of projectiles){p.x+=p.dir*p.speed*dt;p.life-=dt;let target=p.owner===player?enemy:player;if(Math.abs(p.x-target.x)<40&&Math.abs(p.y-(315-target.y))<85){hit(target,p.damage,p.dir*45);p.life=0}}projectiles=projectiles.filter(p=>p.life>0&&p.x>0&&p.x<960);effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);announceTime-=dt;$('ph').style.width=player.hp+'%';$('eh').style.width=enemy.hp+'%';$('cool').textContent=player.cool>0?'Recarga: '+Math.ceil(player.cool/60)+' s':'Especial listo'}
const ctx=$('canvas').getContext('2d');function draw(){ctx.clearRect(0,0,960,540);ctx.fillStyle='#0005';ctx.fillRect(0,455,960,85);ctx.strokeStyle='#ffffff66';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,460);ctx.lineTo(960,460);ctx.stroke();for(let a of [player,enemy])drawFighter(a);for(let p of projectiles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(frame*.15);ctx.fillStyle=p.owner===player?'#ffdc36':'#f249ff';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-25,-21,50,42,12);ctx.fill();ctx.stroke();ctx.fillStyle='#25102d';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('✦',0,8);ctx.restore()}for(let e of effects){ctx.fillStyle='#ffef32';ctx.strokeStyle='#2a043c';ctx.lineWidth=4;ctx.font='bold 35px Arial';ctx.strokeText(e.text,e.x,e.y-(23-e.t)*2);ctx.fillText(e.text,e.x,e.y-(23-e.t)*2)}if(announceTime>0){ctx.font='italic bold 42px Arial';ctx.textAlign='center';ctx.strokeStyle='#250636';ctx.lineWidth=9;ctx.strokeText(announcement,480,105);ctx.fillStyle='#ffe529';ctx.fillText(announcement,480,105)}}
function drawFighter(a){let f=fighters[a.id],x=a.x,y=455-a.y;ctx.save();ctx.translate(x,y);ctx.scale(a.dir,1);if(a.invuln>0&&Math.floor(frame/3)%2)ctx.globalAlpha=.55;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,4,50,12,0,0,Math.PI*2);ctx.fill();let moving=a===player?(keys.left||keys.right):Math.abs(a.x-player.x)>110;let bob=moving?Math.sin(frame*.28)*7:Math.sin(frame*.08)*3;ctx.lineCap='round';ctx.strokeStyle='#141024';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(-16,-90+bob);ctx.lineTo(-25+(moving?Math.sin(frame*.25)*18:0),-8);ctx.moveTo(16,-90+bob);ctx.lineTo(26-(moving?Math.sin(frame*.25)*18:0),-8);ctx.stroke();ctx.fillStyle=f[7];ctx.strokeStyle='#1d0b29';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-38,-184+bob,76,104,16);ctx.fill();ctx.stroke();ctx.strokeStyle='#e9a67d';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-32,-164+bob);ctx.lineTo(-48,-112+bob);ctx.moveTo(32,-164+bob);ctx.lineTo(a.attack>0?88:47,a.attack>0?-145+bob:-113+bob);ctx.stroke();ctx.save();ctx.beginPath();ctx.ellipse(0,-214+bob,35,43,0,0,Math.PI*2);ctx.clip();let portrait=portraits[a.id];if(portrait&&portrait.complete&&portrait.naturalWidth)ctx.drawImage(portrait,-39,-266+bob,78,105);else{ctx.fillStyle='#e7b48d';ctx.fillRect(-40,-260+bob,80,100)}ctx.restore();ctx.strokeStyle='#160a22';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,-214+bob,35,43,0,0,Math.PI*2);ctx.stroke();if(a.attackType==='kick'&&a.attack>0){ctx.strokeStyle='#f1c095';ctx.lineWidth=23;ctx.beginPath();ctx.moveTo(18,-85);ctx.lineTo(94,-110);ctx.stroke()}ctx.restore();ctx.fillStyle='#fff';ctx.strokeStyle='#2b0b3c';ctx.lineWidth=4;ctx.font='bold 19px Arial';ctx.textAlign='center';ctx.strokeText(f[0],x,y-270);ctx.fillText(f[0],x,y-270)}
let ending=false;function finish(win){if(ending||mode!=='game')return;ending=true;keys={};let isTrex=win&&selected===1;let final=win&&battle===10;let html=win?`<h2>${final?'🏆 ¡CAMPEÓN DEL PARIPÉ!':'🏆 ¡VICTORIA!'}</h2><p>${fighters[selected][0]} derrotó a ${fighters[enemy.id][0]}</p>`:`<h2>💥 ¡DERROTA!</h2><p>${fighters[enemy.id][0]} ganó este combate</p>`;if(isTrex)html+=`<div class="phone">📱</div><p id="trexline">📳 ¡Está sonando el celular!</p>`; $('overlayContent').innerHTML=html;$('overlayButtons').innerHTML='';$('overlay').classList.remove('hidden');let delay=isTrex?2800:0;if(isTrex){setTimeout(()=>{let line=$('trexline');if(line)line.textContent='📞 ¿Calle Derrota? Ni idea, maestro.';say('¿Calle derrota? Ni idea maestro.');},1100)}setTimeout(()=>{if(mode!=='game')return;let b=$('overlayButtons');if(win&&!final)b.innerHTML='<button class="btn primary" onclick="nextBattle()">SIGUIENTE RIVAL ▶</button>';else if(win)b.innerHTML='<button class="btn primary" onclick="showSelect()">JUGAR OTRA VEZ</button>';else b.innerHTML='<button class="btn primary" onclick="retry()">REINTENTAR BATALLA</button>';b.innerHTML+='<button class="btn" onclick="goMenu()">MENÚ</button>'},delay)}
function say(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function nextBattle(){battle++;ending=false;newBattle()}function retry(){ending=false;newBattle()}
function loop(t){if(mode!=='game')return;let dt=last?Math.min((t-last)/16.67,2):1;last=t;if(!ending)update(dt);draw();animationId=requestAnimationFrame(loop)}
for(let b of document.querySelectorAll('[data-key]')){let key=b.dataset.key;function press(e){e.preventDefault();keys[key]=true;b.setPointerCapture?.(e.pointerId)}function release(e){e.preventDefault();if(['left','right','jump'].includes(key))keys[key]=false}b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}
const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',KeyJ:'punch',KeyK:'kick',KeyL:'special'};window.addEventListener('keydown',e=>{if(mapping[e.code]){e.preventDefault();keys[mapping[e.code]]=true}});window.addEventListener('keyup',e=>{if(mapping[e.code])keys[mapping[e.code]]=false});
</script></body></html>
